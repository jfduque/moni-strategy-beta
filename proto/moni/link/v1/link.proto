syntax = "proto3";

package moni.link.v1;

service EngineLink {
  rpc GetEngineInfo(GetEngineInfoRequest) returns (EngineInfo);
  rpc SubmitSignal(SubmitSignalRequest) returns (SubmitSignalResponse);
  rpc SubmitCompleteSetSignal(SubmitCompleteSetSignalRequest) returns (SubmitCompleteSetSignalResponse);
  rpc SubmitObservation(SubmitObservationRequest) returns (SubmitObservationResponse);
}

message GetEngineInfoRequest {}

message EngineInfo {
  string engine_id = 1;
  string build = 2;
  repeated string capabilities = 3;
}

message CloseRecoveryPolicy {
  int64 lead_time_ms = 1;
  string max_loss = 2;
}

message SubmitSignalRequest {
  reserved 1;
  reserved "tenant_id";
  string strategy_id = 2;
  string market_id = 3;
  string side = 4;
  string size = 5;
  string confidence = 6;
  string source = 7;
  int64 observed_at_ms = 8;
  optional CloseRecoveryPolicy close_recovery = 9;
}

message SubmitSignalResponse {
  bool accepted = 1;
  string reason = 2;
}

enum CompleteSetDirection {
  COMPLETE_SET_DIRECTION_UNSPECIFIED = 0;
  COMPLETE_SET_DIRECTION_BUY_MERGE = 1;
  COMPLETE_SET_DIRECTION_SPLIT_SELL = 2;
}

message SubmitCompleteSetSignalRequest {
  string signal_id = 1;
  string strategy_id = 2;
  string source = 3;
  string market_id = 4;
  string condition_id = 5;
  string token_a_id = 6;
  string token_b_id = 7;
  CompleteSetDirection direction = 8;
  string quantity = 9;
  string max_pair_cost = 10;
  string min_pair_proceeds = 11;
  string expected_profit = 12;
  string expected_return_bps = 13;
  int64 token_a_book_observed_at_ms = 14;
  int64 token_b_book_observed_at_ms = 15;
  int64 observed_at_ms = 16;
  optional CloseRecoveryPolicy close_recovery = 17;
}

message SubmitCompleteSetSignalResponse {
  bool accepted = 1;
  string reason = 2;
  bool duplicate = 3;
}

message SubmitObservationRequest {
  string tenant_id = 1;
  string strategy_id = 2;
  string market_id = 3;
  string payload_json = 4;
  int64 observed_at_ms = 5;
}

message SubmitObservationResponse {
  bool accepted = 1;
}
